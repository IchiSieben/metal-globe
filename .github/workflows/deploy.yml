# Publica el sitio estático (web/) en GitHub Pages.
#
# NO scrapea Metal Archives: el Cloudflare Turnstile necesita un navegador con
# display + un clic humano, imposible en un runner sin pantalla. El barrido se
# corre LOCAL (ver README), se commitea el web/data/atlas_data.json resultante,
# y este workflow solo lo despliega.
#
# Activación: Settings → Pages → Source: GitHub Actions.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:        # botón para desplegar manualmente

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy a la vez
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload web/ as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
